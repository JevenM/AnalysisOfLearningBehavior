<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>四维学习者画像 · 地区 / 专业背景 / 学习习惯 / 兴趣爱好</title>
<style>
:root{
  --navy:#1F3864; --blue:#2E75B6; --cyan:#2A9D8F; --orange:#D97706; --red:#C0392B;
  --ink:#1B2733; --muted:#64748B; --line:#E2E8F0; --bg:#F4F7FB; --card:#FFFFFF; --soft:#EEF3F9;
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Microsoft YaHei","PingFang SC","Segoe UI",sans-serif;font-size:14px;line-height:1.6}
code{background:var(--soft);color:var(--navy);padding:1px 5px;border-radius:4px;font-size:12px}
a{color:var(--blue);text-decoration:none}
header.hero{background:linear-gradient(120deg,#16294B 0%,#1F3864 52%,#2E75B6 100%);color:#fff;padding:24px 5vw 0;position:relative;overflow:hidden}
header.hero:after{content:"";position:absolute;right:-60px;top:-90px;width:340px;height:340px;border:1px solid rgba(255,255,255,.12);border-radius:50%;box-shadow:0 0 0 55px rgba(255,255,255,.035),0 0 0 120px rgba(255,255,255,.025)}
.hero-inner{max-width:1400px;margin:0 auto;position:relative;z-index:2}
.hero h1{margin:0;font-size:23px;letter-spacing:.5px}
.hero .sub{opacity:.86;font-size:12.5px;margin:5px 0 0}
.tabs{display:flex;gap:8px;margin-top:18px;flex-wrap:wrap}
.tab{cursor:pointer;border:1px solid rgba(255,255,255,.28);background:rgba(255,255,255,.08);color:#EAF2FB;border-radius:9px 9px 0 0;padding:9px 22px;font-size:13px;font-weight:600;transition:.15s;border-bottom:none}
.tab:hover{background:rgba(255,255,255,.16)}
.tab.active{background:var(--card);color:var(--navy);border-color:var(--line)}
.back{font-size:12px;color:#fff;opacity:.85;float:right}
.back:hover{opacity:1;text-decoration:underline}
.wrap{max-width:1400px;margin:0 auto;padding:18px 5vw 70px}
.kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:16px}
.kpi{background:var(--card);border:1px solid var(--line);border-radius:11px;padding:13px 16px;box-shadow:0 2px 9px rgba(31,56,100,.05)}
.kpi b{display:block;font-size:22px;color:var(--navy);line-height:1.2;font-variant-numeric:tabular-nums}
.kpi span{font-size:11.5px;color:var(--muted)}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;box-shadow:0 2px 10px rgba(31,56,100,.05);padding:18px 20px;margin-bottom:16px}
.card h2{margin:0 0 3px;font-size:16px;color:var(--navy);display:flex;align-items:center;gap:9px}
.card h2 .no{width:25px;height:25px;border-radius:7px;background:var(--soft);color:var(--navy);display:inline-flex;align-items:center;justify-content:center;font-size:12px;font-weight:700}
.card .desc{color:var(--muted);font-size:12px;margin:0 0 14px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:16px}
@media(max-width:1000px){.grid2{grid-template-columns:1fr}.kpis{grid-template-columns:repeat(2,1fr)}}
h3{font-size:13px;margin:4px 0 8px;color:var(--navy)}
.ctrl{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-bottom:10px;font-size:11.5px;color:var(--muted)}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:8px;overflow:hidden}
.seg button{border:none;background:#fff;color:var(--muted);padding:5px 12px;font-size:11.5px;cursor:pointer;font-family:inherit}
.seg button.on{background:var(--navy);color:#fff}
.note{background:var(--soft);border-left:3px solid var(--blue);padding:9px 13px;font-size:11.5px;color:#3E5670;border-radius:0 7px 7px 0;margin:10px 0}
.note.warn{background:#FFF8EC;border-left-color:var(--orange);color:#7A4E12}
.sig{display:inline-block;font-size:10.5px;padding:1px 8px;border-radius:12px;font-weight:700;margin-left:6px}
.sig.y{background:#E6F4EF;color:#1E7A63;border:1px solid #BFE3D7}
.chart{width:100%;overflow:auto}
.chart svg{display:block;max-width:100%;height:auto}
table{width:100%;border-collapse:collapse;font-size:11.5px}
th,td{padding:6px 9px;text-align:right;border-bottom:1px solid var(--line);white-space:nowrap}
th:first-child,td:first-child{text-align:left}
thead th{background:var(--soft);color:var(--navy);font-weight:700;cursor:pointer;user-select:none}
thead th:hover{background:#DFEAF6}
tbody tr:hover{background:#F8FBFE}
.tblwrap{overflow-x:auto}
.barcell{position:relative;min-width:120px}
.barcell i{position:absolute;left:0;top:50%;transform:translateY(-50%);height:16px;border-radius:3px;opacity:.16;z-index:0}
.barcell span{position:relative;z-index:1}
footer{text-align:center;color:var(--muted);font-size:11px;padding:20px;border-top:1px solid var(--line);background:#fff}
#tip{position:fixed;pointer-events:none;background:rgba(16,32,56,.94);color:#fff;font-size:11px;line-height:1.6;padding:7px 10px;border-radius:7px;z-index:99;display:none;box-shadow:0 6px 18px rgba(0,0,0,.2);white-space:nowrap}
</style>
</head>
<body>
<header class="hero">
  <div class="hero-inner">
    <a class="back" href="persona_dashboard.html">← 形态画像看板</a>
    <h1>四维学习者画像分析</h1>
    <p class="sub">地区 · 专业背景 · 学习习惯 · 兴趣爱好 —— 从显性/隐性行为刻画群体，回答“不识其人，即知其理”</p>
    <nav class="tabs" id="tabs"></nav>
  </div>
</header>
<div class="wrap">
  <div class="kpis" id="kpis"></div>
  <section class="card">
    <h2><span class="no">1</span><span id="chartTitle">分组对照</span></h2>
    <p class="desc" id="chartDesc"></p>
    <div class="ctrl">
      <span>指标</span>
      <div class="seg" id="metricSeg"></div>
      <span id="sortHint" style="margin-left:auto">点击表头可排序 · 悬停条形查看明细</span>
    </div>
    <div class="grid2">
      <div><div class="chart" id="chart"></div></div>
      <div><div id="statBox"></div><div class="tblwrap" style="margin-top:10px"><table id="tbl"></table></div></div>
    </div>
  </section>
  <div id="extra"></div>
  <div class="note warn" id="ethics"></div>
</div>
<div id="tip"></div>
<footer>全部数字来自真实公开数据（OULAD 英国 / 清华 FIB WWW2025 短视频·中国 / 阿里云天池微课·中国）· 由 profile_modeling.py 实算 · 群体关联非因果，不用于个体评价</footer>

<script id="profile" type="application/json">__PROFILE_DATA__</script>
<script>
"use strict";
const D = JSON.parse(document.getElementById('profile').textContent);
const $ = id => document.getElementById(id);
const esc = s => String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const fx=(v,n=2)=>(v===null||v===undefined||isNaN(Number(v)))?'—':Number(v).toFixed(n);
const pct=(v,n=1)=>(v===null||v===undefined)?'—':(v*100).toFixed(n)+'%';
const pv=v=>(v===null||v===undefined)?'—':(typeof v==='string'?v:(Number(v)<0.001?'<0.001':'='+Number(v).toFixed(3)));
const NS='http://www.w3.org/2000/svg';
const svg=(w,h,inner)=>`<svg viewBox="0 0 ${w} ${h}" width="${w}" height="${h}" xmlns="${NS}" font-family="Microsoft YaHei,PingFang SC,sans-serif">${inner}</svg>`;
const tx=(x,y,s,z=10,c='#64748B',a='start',w='normal')=>`<text x="${x}" y="${y}" font-size="${z}" fill="${c}" text-anchor="${a}" font-weight="${w}">${esc(s)}</text>`;
const rc=(x,y,w,h,f,r=4,extra='')=>`<rect x="${x}" y="${y}" width="${w}" height="${h}" rx="${r}" fill="${f}" ${extra}/>`;
const TIP=$('tip');
function tipOn(e,html){TIP.innerHTML=html;TIP.style.display='block';tipMove(e);}
function tipMove(e){let x=e.clientX+14,y=e.clientY+14;if(x+250>innerWidth)x=e.clientX-260;if(y+130>innerHeight)y=e.clientY-140;TIP.style.left=x+'px';TIP.style.top=y+'px';}
function tipOff(){TIP.style.display='none';}

const PALETTE=['#2E75B6','#2A9D8F','#D97706','#7B4FA8','#C0392B','#5B8C5A','#B7791F','#2E75B6','#1F5A94','#9A5B0B','#4A7C7E','#6C7A89','#8E6E53'];
const DIMS=[
  {id:'region', name:'地区差异', sub:'英国开放大学 13 类地域 · locale',
   kpis:[['地区类别',d=>d.rows.length,'类'],['样本量',d=>d.rows.reduce((a,r)=>a+r.n,0).toLocaleString(),'条'],['通过率极差',d=>{const v=d.rows.map(r=>r.pass_rate);return pct(Math.max(...v)-Math.min(...v))},''],['Cramér’s V',d=>fx(d.chi2.cramers_v,3),'关联强度']],
   chartTitle:'13 类地区的参与与成效对照', chartDesc:'按所选指标排序；条形长度=指标值，颜色区分高低。卡方检验显著但关联强度弱，说明地区携带信息但解释力有限。',
   metrics:[['pass_rate','真实通过率'],['visits','访问次数'],['active_days','活跃天数'],['n','样本数']],
   rows:d=>d.rows, label:r=>r.group,
   stat:d=>`<div class="note"><b>差异检验</b>　卡方 χ²=${d.chi2.chi2}，df=${d.chi2.dof}，p${pv(d.chi2.p)} <span class="sig y">显著</span>；Cramér’s V=${d.chi2.cramers_v}（弱关联）。<br>地区间访问次数 Kruskal–Wallis H=${d.kw_visits.H}，p${pv(d.kw_visits.p)}。</div>`,
   cols:[['group','地区'],['n','样本数'],['share','占比'],['pass_rate','通过率'],['visits','访问次数'],['active_days','活跃天数']],
   fmt:(r,k)=>k==='n'?r.n.toLocaleString():(k==='share'||k==='pass_rate')?pct(r[k]):fx(r[k],k==='visits'?0:1),
   extra:d=>''},
  {id:'background', name:'专业背景', sub:'学历 + 课程模块 + 选课门数（代理口径）',
   kpis:[['学历层次',d=>d.education.length,'类'],['学科模块',d=>d.discipline.length,'个'],['通过率跨度',d=>pct(d.education[d.education.length-1].pass_rate-d.education[0].pass_rate),'学历'],['最高通过率',d=>pct(Math.max(...d.education.map(r=>r.pass_rate))),'研究生']],
   chartTitle:'学历层次与课程模块的成效梯度', chartDesc:'可切换“学历 / 课程模块 / 选课门数”。数据集无专业自陈字段，三者均为专业背景代理。',
   metrics:[['pass_rate','真实通过率'],['visits','访问次数'],['n','样本数']],
   rows:d=>d.education, label:r=>r.group,
   stat:d=>`<div class="note"><b>差异检验</b>　学历×结果 χ²=${d.chi2_edu.chi2}（p${pv(d.chi2_edu.p)}，Cramér’s V=${d.chi2_edu.cramers_v}）；课程模块×结果 χ²=${d.chi2_disc.chi2}（p${pv(d.chi2_disc.p)}）。</div>`,
   cols:[['group','分组'],['n','样本数'],['share','占比'],['pass_rate','通过率'],['visits','访问次数']],
   fmt:(r,k)=>k==='n'?r.n.toLocaleString():(k==='share'||k==='pass_rate')?pct(r[k]):fx(r[k],0),
   extra:d=>`<section class="card"><h2><span class="no">2</span>课程模块（学科方向）与选课门数</h2>
     <p class="desc">课程模块为 OULAD 编码，原数据不提供学科中文名；选课门数为同一学习者注册的不同课程数（真实派生）。</p>
     <div class="grid2"><div><h3>课程模块 × 通过率</h3><div class="chart" id="bgDisc"></div></div>
     <div><h3>选课门数 × 通过率</h3><div class="chart" id="bgCnum"></div></div></div></section>`,
   after:d=>{drawBars('bgDisc',d.discipline,'pass_rate',r=>r.group,v=>pct(v));drawBars('bgCnum',d.course_num,'pass_rate',r=>r.group,v=>pct(v));}},
  {id:'habit', name:'学习习惯', sub:'行为节律分型（OULAD）+ 观看时段偏好（短视频）',
   kpis:[['习惯分型',d=>d.types.length,'类'],['深耕型占比',d=>pct(d.types[0].share),''],['分型通过率差',d=>pct(d.types[0].pass_rate-d.types[d.types.length-1].pass_rate),''],['时段峰值',d=>{const p=d.time_of_day.user_pref;return p&&p.length?p[0].group:'—'},'']],
   chartTitle:'五类学习习惯分型的规模与成效', chartDesc:'由启动滞后、活跃密度、单次时长、资源覆盖四阈值规则生成，可解释、独立于成效画像。可切换指标。',
   metrics:[['pass_rate','真实通过率'],['share','人群占比'],['active_days','活跃天数'],['lag','启动滞后(天)'],['session_min','单次时长(分)']],
   rows:d=>d.types, label:r=>r.group,
   stat:d=>`<div class="note"><b>差异检验</b>　习惯分型×结果 χ²=${d.chi2.chi2}（p${pv(d.chi2.p)}）<span class="sig y">强关联</span>；启动滞后 Kruskal–Wallis H=${d.kw_lag.H}（p${pv(d.kw_lag.p)}）。四类维度中习惯信号最强。</div>`,
   cols:[['group','习惯类型'],['n','人数'],['share','占比'],['pass_rate','通过率'],['lag','启动滞后'],['active_days','活跃天数'],['session_min','单次时长']],
   fmt:(r,k)=>k==='n'?r.n.toLocaleString():(['share','pass_rate'].includes(k))?pct(r[k]):fx(r[k],k==='session_min'?2:1),
   extra:d=>`<section class="card"><h2><span class="no">2</span>观看时段偏好 · 登录时间行为</h2>
     <p class="desc">短视频小时级 p_hour（${d.sv_profile.n_users.toLocaleString()} 用户）显示观看高峰；OULAD 仅日粒度，二者分层呈现、不直接合并。</p>
     <div class="grid2"><div><h3>用户主时段占比</h3><div class="chart" id="hbPref"></div></div>
     <div><h3>各时段事件占比与完播代理</h3><div class="chart" id="hbTod"></div></div></div></section>`,
   after:d=>{const t=d.time_of_day;if(t.user_pref){drawBars('hbPref',t.user_pref,'share',r=>r.group,v=>pct(v));}if(t.rows){drawBars('hbTod',t.rows,'share',r=>r.group,v=>pct(v));}}},
  {id:'interest', name:'兴趣爱好', sub:'短视频内容类目偏好（行为代理，非心理测量）',
   kpis:[['短视频用户',d=>d.n_users.toLocaleString(),'人'],['一级类目',d=>d.n_categories,'类'],['知识求知型',d=>{const r=d.interest_types.find(x=>x.group==='知识求知型');return r?pct(r.share):'—'},''],['多样性均值',d=>fx(d.diversity_mean,3),'归一化熵']],
   chartTitle:'内容类目观看时长占比', chartDesc:'按观看时长聚合的 Top 类目；切换到“兴趣画像”看用户分群。“兴趣”由观看占比推断，仅作人群描述。',
   metrics:[['watch_share','观看时长占比'],['events','交互事件数']],
   rows:d=>d.cat_watch, label:r=>r.cat,
   stat:d=>`<div class="note"><b>兴趣画像</b>　知识求知型 ${pct((d.interest_types.find(x=>x.group==='知识求知型')||{}).share)}、均衡杂食型 ${pct((d.interest_types.find(x=>x.group==='均衡杂食型')||{}).share)}、娱乐休闲型 ${pct((d.interest_types.find(x=>x.group==='娱乐休闲型')||{}).share)}。教育类子群平均观看 ${d.edu_subgroup.education.avg_watch_sec}s，低于全平台 ${d.edu_subgroup.all.avg_watch_sec}s。</div>`,
   cols:[['cat','内容类目'],['watch_share','观看占比'],['events','事件数']],
   fmt:(r,k)=>k==='events'?r.events.toLocaleString():pct(r[k]),
   extra:d=>`<section class="card"><h2><span class="no">2</span>用户兴趣画像 · 知识 vs 娱乐</h2>
     <p class="desc">按知识类（教育/科学/读书/历史/财经/法律/数码）与娱乐类（影视/搞笑/游戏/音乐/明星/二次元）观看占比划分。</p>
     <div class="grid2"><div><h3>三类兴趣画像占比</h3><div class="chart" id="itShare"></div></div>
     <div><h3>知识类 / 娱乐类偏好强度</h3><div class="chart" id="itPref"></div></div></div></section>`,
   after:d=>{drawBars('itShare',d.interest_types,'share',r=>r.group,v=>pct(v));
     // 双系列偏好条形
     const it=d.interest_types; const w=430,rowH=44,L=78,R=20,T=22,plot=w-L-R;
     let s=tx(L,T-8,'知识类',10,'#2A9D8F','start')+tx(w-R,T-8,'娱乐类',10,'#C0392B','end');
     it.forEach((r,i)=>{const y=T+i*rowH,mid=L+plot/2,half=plot/2;
       const kv=r.know_share,ev=r.ent_share,mx=Math.max(kv,ev,0.5);
       s+=rc(mid-kv/mx*half,y+6,kv/mx*half,11,'#2A9D8F',3,'opacity=".85"');
       s+=rc(mid,y+22,ev/mx*half,11,'#C0392B',3,'opacity=".85"');
       s+=tx(8,y+14,r.group,10.5,'#334155','start');
       s+=tx(mid-kv/mx*half-4,y+15,pct(kv,0),9,'#2A9D8F','end');
       s+=tx(mid+ev/mx*half+4,y+31,pct(ev,0),9,'#C0392B','start');
     });
     $('itPref').innerHTML=svg(w,it.length*rowH+T+6,s);}},
  {id:'sv_profile', name:'短视频用户属性', sub:'城市等级 / 性别 / 年龄 / 时段 / 城乡（中国国内数据）',
   kpis:[['国内用户',d=>d.n_users.toLocaleString(),'人'],['覆盖城市',d=>d.n_cities,'座'],['城市等级',d=>d.city_level.length,'档'],['晚间+下午占比',d=>{const g=d.main_seg.filter(r=>/晚间|下午/.test(r.group));return pct(g.reduce((a,r)=>a+r.share,0))},'']],
   chartTitle:'城市等级 × 观看完成度与互动（国内）', chartDesc:'中国 6 档城市等级用户的观看完成度与互动率；可切换性别/年龄/时段/城乡。完成度为观看时长/视频时长代理，非真实完课。',
   metrics:[['finish_ratio','观看完成度'],['interact_rate','互动率'],['full_watch_rate','完整观看率'],['share','人群占比'],['avg_watch_sec','平均观看秒']],
   rows:d=>d.city_level, label:r=>r.group,
   stat:d=>`<div class="note"><b>差异检验</b>　城市等级×完成度 Kruskal–Wallis H=${d.kw_city.H}，p${pv(d.kw_city.p)} ${d.kw_city.significant?'<span class="sig y">显著</span>':'<span class="sig n">不显著</span>'}；性别 p${pv(d.kw_gender.p)}、年龄 p${pv(d.kw_age.p)}、时段 p${pv(d.kw_seg.p)}。<br>完成度随年龄递增（20–24岁 43.1% → 65岁以上 50.0%）；城市等级差异统计显著但实际极差仅 ${pct(d.finish_range)}，效应弱。</div>`,
   cols:[['group','分组'],['n','人数'],['share','占比'],['finish_ratio','完成度'],['full_watch_rate','完整观看'],['interact_rate','互动率'],['avg_watch_sec','观看秒']],
   fmt:(r,k)=>k==='n'?r.n.toLocaleString():(['share','finish_ratio','full_watch_rate','interact_rate'].includes(k))?pct(r[k]):fx(r[k],1),
   extra:d=>`<section class="card"><h2><span class="no">2</span>性别 · 年龄 · 观看时段 · 城乡 · 热门城市</h2>
     <p class="desc">短视频人口属性均为真实用户自陈/平台字段。观看时段 p_hour 小时级，晚间(18–21) 与下午(12–17) 合计约 65%。</p>
     <div class="grid2"><div><h3>性别 × 完成度/互动</h3><div class="chart" id="spGender"></div></div>
     <div><h3>年龄段 × 完成度</h3><div class="chart" id="spAge"></div></div>
     <div><h3>观看时段 × 占比</h3><div class="chart" id="spSeg"></div></div>
     <div><h3>城乡类型 × 完成度</h3><div class="chart" id="spComm"></div></div></div>
     <p class="desc" style="margin-top:10px">热门城市（用户数）：${d.city_top.slice(0,6).map(c=>esc(c.group)+' '+c.n.toLocaleString()).join(' · ')}</p></section>`,
   after:d=>{drawBars('spGender',d.gender,'finish_ratio',r=>r.group,v=>pct(v));
     drawBars('spAge',d.age_band,'finish_ratio',r=>r.group,v=>pct(v));
     drawBars('spSeg',d.main_seg,'share',r=>r.group,v=>pct(v));
     drawBars('spComm',d.community,'finish_ratio',r=>r.group,v=>pct(v));}},
  {id:'tianchi', name:'天池倍速标签', sub:'倍速 / 设备 / OS / 网络 / 预习（国内脱敏微课）',
   kpis:[['事件数',d=>d.n_events.toLocaleString(),'条'],['学习者',d=>d.n_learners.toLocaleString(),'人'],['视频事件',d=>d.n_video_events.toLocaleString(),'条'],['预习事件',d=>d.n_preview.toLocaleString(),'条']],
   chartTitle:'倍速 × 观看进度增益（仅视频事件）', chartDesc:'原始数据将非视频事件倍速统一记为 1.0× 且进度增益≈0，会造成虚假差异；此处严格限定在 video_play 事件内，避免结构性伪影。',
   metrics:[['progress_delta','进度增益(点)'],['interaction_cnt','交互次数'],['share','事件占比'],['n','事件数']],
   rows:d=>d.playback_speed, label:r=>r.group,
   stat:d=>`<div class="note"><b>口径修正与检验</b>　倍速×进度增益 Kruskal–Wallis H=${d.kw_speed_progress.H}，p${pv(d.kw_speed_progress.p)} <span class="sig n">不显著</span>——各倍速进度增益接近（${d.playback_speed.map(r=>r.progress_delta).join(' / ')} 百分点），不存在“倍速越高学得越多”。<br>课前预习 vs 常规回看进度增益 16.84 vs 16.09（Mann–Whitney p${pv(d.mw_preview_progress.p)}），同为视频事件内对照，差异不显著。</div>`,
   cols:[['group','分组'],['n','事件数'],['share','占比'],['progress_delta','进度增益'],['interaction_cnt','交互次数'],['satisfaction','满意度']],
   fmt:(r,k)=>k==='n'?r.n.toLocaleString():(k==='share')?pct(r[k]):fx(r[k],k==='progress_delta'?2:1),
   extra:d=>`<section class="card"><h2><span class="no">2</span>预习 · 设备 · 操作系统 · 网络 · 测评标签</h2>
     <p class="desc">预习=remark 含“课前预习”（严格在视频事件内对照）；设备/OS/网络为全事件分布；测评标签为天池源字段。</p>
     <div class="grid2"><div><h3>预习 × 进度增益</h3><div class="chart" id="tcPrev"></div></div>
     <div><h3>设备 × 交互次数</h3><div class="chart" id="tcDev"></div></div>
     <div><h3>网络类型 × 占比</h3><div class="chart" id="tcNet"></div></div>
     <div><h3>操作系统 × 占比</h3><div class="chart" id="tcOS"></div></div></div></section>`,
   after:d=>{drawBars('tcPrev',d.preview,'progress_delta',r=>r.group,v=>fx(v,1));
     drawBars('tcDev',d.device,'interaction_cnt',r=>r.group,v=>fx(v,1));
     drawBars('tcNet',d.network,'share',r=>r.group,v=>pct(v));
     drawBars('tcOS',d.client_os,'share',r=>r.group,v=>pct(v));}}
];

function drawBars(el,rows,key,labelFn,fmtFn){
  const box=$(el); if(!box||!rows||!rows.length)return;
  const w=430,rowH=29,L=104,R=52,T=8,plot=w-L-R;
  const arr=rows.map(r=>({r,v:key==='n'?r.n:(Number(r[key])||0)})).sort((a,b)=>a.v-b.v);
  const mx=Math.max(...arr.map(a=>a.v),1e-9);
  let s='';
  arr.forEach((a,i)=>{const y=T+i*rowH,len=Math.max(2,a.v/mx*plot);
    s+=rc(L,y+2,len,18,PALETTE[i%PALETTE.length],3,'opacity=".82"');
    s+=tx(L-6,y+15,labelFn(a.r),10,'#334155','end');
    s+=tx(L+len+5,y+15,fmtFn(a.v),9.5,'#1F3864','start','bold');
  });
  box.innerHTML=svg(w,arr.length*rowH+T+4,s);
}

let CUR='region', METRIC={}, SORT={};
function kpiHtml(dim){return dim.kpis.map(([name,fn,unit])=>`<div class="kpi"><b>${fn(D[dim.id])}</b><span>${name}${unit?' · '+unit:''}</span></div>`).join('');}
function render(id){
  CUR=id; const dim=DIMS.find(d=>d.id===id), d=D[dim.id];
  [...$('tabs').children].forEach(b=>b.classList.toggle('active',b.dataset.id===id));
  $('kpis').innerHTML=kpiHtml(dim);
  $('chartTitle').textContent=dim.chartTitle; $('chartDesc').textContent=dim.chartDesc;
  $('metricSeg').innerHTML=dim.metrics.map(([k,n])=>`<button data-k="${k}" class="${(METRIC[id]||dim.metrics[0][0])===k?'on':''}">${n}</button>`).join('');
  [...$('metricSeg').children].forEach(b=>b.onclick=()=>{METRIC[id]=b.dataset.k;render(id);});
  $('extra').innerHTML=dim.extra(d)||'';
  $('statBox').innerHTML=dim.stat(d);
  $('ethics').innerHTML='<b>口径与伦理边界</b>　'+(D.meta.ethics||[]).map(e=>esc(e)).join('　');
  SORT[id]=SORT[id]||{k:null,dir:-1};
  drawMain(dim,d);
  if(dim.after)dim.after(d);
}
function drawMain(dim,d){
  const key=METRIC[CUR]||dim.metrics[0][0];
  let rows=dim.rows(d).slice();
  const sk=SORT[CUR];
  if(sk.k)rows.sort((a,b)=>{const va=Number(a[sk.k])||0,vb=Number(b[sk.k])||0;return (va-vb)*sk.dir;});
  drawBars('chart',rows,key,dim.label,v=>key==='n'||key==='events'?Number(v).toLocaleString():(key==='pass_rate'||key==='share'||key==='watch_share')?pct(v):fx(v,1));
  // 表格
  const cols=dim.cols;
  let h='<thead><tr>'+cols.map(([k,n])=>`<th data-k="${k}">${n}${sk.k===k?(sk.dir<0?' ↓':' ↑'):''}</th>`).join('')+'</tr></thead><tbody>';
  rows.forEach(r=>{h+='<tr>'+cols.map(([k])=>`<td>${(k==='group'||k==='cat')?esc(r[k]):dim.fmt(r,k)}</td>`).join('')+'</tr>';});
  h+='</tbody>'; $('tbl').innerHTML=h;
  [...$('tbl').querySelectorAll('th')].forEach(th=>th.onclick=()=>{const k=th.dataset.k;SORT[CUR]={k,dir:(sk.k===k?-sk.dir:-1)};drawMain(dim,d);});
}

$('tabs').innerHTML=DIMS.map(d=>`<div class="tab" data-id="${d.id}">${d.name}</div>`).join('');
[...$('tabs').children].forEach(b=>b.onclick=()=>render(b.dataset.id));
render('region');
</script>
